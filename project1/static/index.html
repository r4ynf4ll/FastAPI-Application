<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>✨ Random Magic Number ✨</h1>
            <p class="subtitle">Click the button to reveal your lucky number!</p>
            
            <div class="display-box">
                <p class="number-display" id="numberDisplay">?</p>
            </div>
            
            <button class="magic-button" id="generateBtn">Generate Number</button>
            
            <p class="info-text" id="infoText">Click the button to get started!</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
